spring.application.name=electronicstore

#Datasource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/electronicstore
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true


# path config
user.profile.image.path =images/users/
category.profile.image.path =images/categories/
product.profile.image.path = images/products/

# file config
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Actuator endpoints settings
management.endpoints.web.exposure.include=*

#Secret Key
jwt.secret=${JWT_SECRET}

# 5 hours in milliseconds
token.validity=18000000

# google credentials
app.google.client_id=${GOOGLE_CLIENT_ID}
app.default_password=${GOOGLE_CLIENT_SECRET}
